name: Deploy Techflow App To EC2 Instance

env:
    IMAGE_NAME: munirihzowe/techflow-app
on:
  push:
    branches:
      - main
  pull_request:
    branches:
        - main

jobs:

  # -------------------------------------------
  # Job 1: Run Tests
  # -------------------------------------------
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                python-version: '3.13'
            - name: Install dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
            - name: Run tests
              run: |
                pytest test_app.py -v

  # ---------------------------------------------
  # Job 2: Build & Push Docker Image
  # ---------------------------------------------
    build-and-push:
        runs-on: ubuntu-latest
        needs: test
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
            
            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
               
            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                context: .
                push: true
                tags: |
                  ${{ env.IMAGE_NAME }}:${{ github.sha }}
                  ${{ env.IMAGE_NAME }}:latest

  # ---------------------------------------------
  # Job 3: Deploy App to EC2
  # ---------------------------------------------                  
    deploy:
        runs-on: ubuntu-latest
        needs: [ test, build-and-push ]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ secrets.AWS_REGION }}

            - name: GET EC2 Instance IP
              run: |
                EC2_HOST=$(aws ec2 describe-instances \
                --region ${{ secrets.AWS_REGION }} \
                --filters "Name=tag:Name,Values=techflow-server" "Name=instance-state-name,Values=running" \
                --query "Reservations[0].Instances[0].PublicIpAddress" \
                --output text)

                echo "EC2 HOST IP=$EC2_HOST"

                if [ "$EC2_HOST" = "None" ]; then
                  echo "Error: EC2 instance is not running or does not have a public IP."
                  exit 1
                fi

                echo "EC2_HOST=$EC2_HOST" >> $GITHUB_ENV
            - name: Copy scripts to EC2 Instance
              uses: appleboy/scp-action@v1
              with:
                host: ${{ env.EC2_HOST }}
                username: ${{ secrets.EC2_USERNAME }}
                key: ${{ secrets.EC2_SSH_KEY }}
                source: "./scripts/*"
                target: "/home/${{ secrets.EC2_USERNAME }}"
            - name: Execute SSH commands using SSH key
              uses: appleboy/ssh-action@v1
              with:
                host: ${{ env.EC2_HOST }}
                username: ${{ secrets.EC2_USERNAME }}
                key: ${{ secrets.EC2_SSH_KEY }}
                envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_NAME
                script: |
                    set -e
                    cd /home/${{ secrets.EC2_USERNAME }}/scripts
                    chmod +x *.sh

                    ./tag_stable.sh
                    # Pull the latest Docker image
                    docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}
    
                    # Stop and remove the existing container if it exists
                    if [ "$(docker ps -q -f name=techflow-app)" ]; then
                        docker stop techflow-app
                        docker rm techflow-app
                    fi
    
                    # Run the new container
                    docker run -d --name techflow-app -p 5000:5000 ${{ env.IMAGE_NAME }}:${{ github.sha }}
              env:
                DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
                IMAGE_NAME: ${{ env.IMAGE_NAME }}

            - name: Application health check
              uses: appleboy/ssh-action@v1
              with:
                host: ${{ env.EC2_HOST }}
                username: ${{ secrets.EC2_USERNAME }}
                key: ${{ secrets.EC2_SSH_KEY }}
                envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE_NAME
                script: |
                    set -e
                    cd /home/${{ secrets.EC2_USERNAME }}/scripts
                    chmod +x *.sh

                    if ! ./health_check.sh; then
                      echo "Health check failed, rolling back..."
                      ./rollback.sh
                      exit 1
                    fi
              env:
                DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
                IMAGE_NAME: ${{ env.IMAGE_NAME }}
            - name: Send confirmation mail
              if: always() 
              uses: dawidd6/action-send-mail@v3
              with:
                server_address: smtp.gmail.com
                server_port: 465
                secure: true
                username: ${{secrets.EMAIL_USERNAME}}
                password: ${{secrets.EMAIL_APP_PASSWORD}}
                subject: Deployment Notification - Techflow App CI/CD
                to: ${{ secrets.RECIPIENT_EMAIL }}
                from: ${{ secrets.EMAIL_USERNAME }}
                body: |
                  Deployment Summary

                  Status: ${{ job.status == 'success' && '✅ Deployment Succeeded' || '❌ Deployment Failed'}}
                  Commit: ${{ github.sha }}
                  Author: ${{ github.actor }}
                  Branch: ${{ github.ref_name }}

                  Your app is live at: http://${{ env.EC2_HOST }}:5000

                  View Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

                